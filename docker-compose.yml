services:
  phz-ric:
    build:
      context: .
    ports:
      - 8005:8005
    #Enable GPU -support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]

  test:
    build:
      context: .
      target: go-builder
    command: go test ./server/... -v
    working_dir: /app
    #Enable GPU -support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]
